name: brew pr-pull
on:
  pull_request_target:
    types:
      - labeled
  # Publish automatically once test-bot has built the bottles for a release PR.
  workflow_run:
    workflows:
      - brew test-bot
    types:
      - completed
jobs:
  pr-pull:
    # Labeled: any PR with the pr-pull label (manual publish).
    # workflow_run: only a successful test-bot run on a waybill-* branch of this repository,
    # which the waybill release workflow creates, so fork PRs are never published without review.
    if: >-
      (github.event_name == 'pull_request_target' &&
       contains(github.event.pull_request.labels.*.name, 'pr-pull')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'waybill-'))
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          PULL_REQUEST: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PULL_REQUEST" ]; then
            echo "::error::No pull request is associated with this test-bot run."
            exit 1
          fi
          brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --artifact "bottles{,_*,-*}" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          token: ${{ github.token }}
          branch: main

      - name: Delete branch
        # The workflow_run condition above already limits it to branches of this repository.
        if: github.event_name == 'workflow_run' || github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
        run: git push --delete origin "$BRANCH"
